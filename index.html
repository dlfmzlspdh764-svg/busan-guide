<style>
:root{--blue:#0b6bcb;--sea:#11a3c7;--bg:#f4f7fb;--card:#fff;--ink:#1c2430;--sub:#6b7686;--line:#e4e9f0;--pink:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe6ee;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue),var(--sea));color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:2px 0 10px;font-size:12px;opacity:.9}
.search{display:flex;gap:6px}
.search input{flex:1;border:0;border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
.favbtn{border:0;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600}
.favbtn.on{background:#fff;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);position:sticky;top:var(--hh,118px);z-index:9;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:4px 16px 16px}
.sec-title{font-size:16px;font-weight:700;margin:14px 0 8px}
.hint{font-size:12px;color:var(--sub);margin:0 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,80,.06);position:relative}
.card h3{margin:0 34px 4px 0;font-size:16px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:#eef4fb;color:var(--blue);font-weight:600}
.tag.cat{background:#fff4e6;color:#c76a00}
.tag.ok{background:#e7f8ee;color:#16884a}
.tag.warn{background:#fff1f1;color:#c62828}
.note{font-size:13px;color:#3a4553;line-height:1.5;margin:0 0 10px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a{font-size:12px;text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:600}
.naver{background:#03c75a;color:#fff}.kakao{background:#fee500;color:#191919}.off{background:#eef1f5;color:var(--ink)}
.heart{position:absolute;top:10px;right:10px;border:0;background:none;font-size:22px;line-height:1;color:#c5ccd6;padding:4px}
.heart.on{color:var(--pink)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 0}
ol.stops{margin:6px 0 10px;padding:0;list-style:none;counter-reset:s}
ol.stops li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:13px;line-height:1.45}
ol.stops li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--sea);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.stops li:not(:last-child)::after{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:var(--line)}
ol.stops b{display:block;font-size:14px}
ol.stops a{font-size:11px;color:var(--blue);text-decoration:none}
.date{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:4px}
.banner{background:linear-gradient(135deg,#1c2430,#33445c);color:#fff;border-radius:16px;padding:14px;margin:10px 0}
.banner b{font-size:15px}.banner p{margin:4px 0 0;font-size:12px;opacity:.85}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:21px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--blue);font-weight:700}
nav button.on .ic{filter:none;opacity:1}
footer{font-size:11px;color:var(--sub);text-align:center;padding:10px 16px 20px;line-height:1.6}
.hide{display:none!important}
</style>

 {n:"2026 부산돼지국밥대전",d:"~ 10.18(일)",s:"2026-08-16",e:"2026-10-18",p:"",ok:true,u:"https://www.visitbusan.net/schedule/list.do?boardId=BBS_0000009&menuCd=DOM_000000204012000000&month=0&year=2026",src:"Visit Busan"},
 {n:"BIFF 전야제 (남포동)",d:"10.5(월) 19:00",s:"2026-10-05",e:"2026-10-05",p:"남포동 BIFF광장 야외무대",ok:true,u:"https://www.biff.kr/kor/",src:"부산국제영화제 공식"},
 {n:"제31회 부산국제영화제 (BIFF)",d:"10.6(화) ~ 10.15(목)",s:"2026-10-06",e:"2026-10-15",p:"영화의전당 등 센텀시티 일원",ok:true,u:"https://www.biff.kr/kor/",src:"부산국제영화제 공식",x:"개막식 10.6 18:00 · 폐막식 10.15 18:00 (영화의전당)"},
 {n:"제33회 부산자갈치축제",d:"10.15(목) ~ 10.18(일)",s:"2026-10-15",e:"2026-10-18",p:"자갈치시장 일원",ok:true,u:"http://www.ejagalchi.co.kr/",src:"축제 공식 홈페이지",x:"개막식 10.15 19:00"},
 {n:"제32회 동래읍성역사축제",d:"10.16(금) ~ 10.18(일)",s:"2026-10-16",e:"2026-10-18",p:"동래읍성·온천천 일원 (동래구)",ok:true,u:"https://www.visitbusan.net/schedule/list.do?boardId=BBS_0000009&menuCd=DOM_000000204012000000&month=0&year=2026",src:"Visit Busan"},
 {n:"제10회 라라라 페스티벌",d:"10.23(금) ~ 10.25(일)",s:"2026-10-23",e:"2026-10-25",p:"",ok:true,u:"https://www.visitbusan.net/schedule/list.do?boardId=BBS_0000009&menuCd=DOM_000000204012000000&month=0&year=2026",src:"Visit Busan",x:"장소는 공식 안내 확인"},
 {n:"제34회 영도다리축제",d:"10.30(금) ~ 11.1(일)",s:"2026-10-30",e:"2026-11-01",p:"아미르공원·봉래동 물양장 (영도구)",ok:false,u:"https://www.yeongdo.go.kr/ydfestival.web",src:"축제정보 사이트 (영도구 주최 정보)",x:"공식 페이지에서 재확인 권장"},
 {n:"제17회 부산고등어축제",d:"10.30(금) ~ 11.1(일)",s:"2026-10-30",e:"2026-11-01",p:"송도해수욕장 일원 (서구)",ok:true,u:"https://busangde.co.kr/",src:"축제 공식 홈페이지"},
 {n:"제21회 부산불꽃축제",d:"11.7(토)",s:"2026-11-07",e:"2026-11-07",p:"광안리해수욕장·이기대·동백섬 일원",ok:true,u:"https://busanfireworks.com/",src:"부산불꽃축제 공식",x:"10월이 아닌 11월 행사 · 유료석 예매 진행 중(보도)"}
];

const STAY=[
 {h:"해운대",t:"바다 앞 호텔이 가장 많고 해변·맛집·BIFF(센텀) 접근이 좋아요. 2호선·동해선 이용."},
 {h:"광안리·수영",t:"광안대교 야경이 강점. 불꽃축제(11.7) 시즌엔 매우 빨리 마감돼요."},
 {h:"서면",t:"1·2호선 환승역 중심이라 어디든 이동이 편하고 밤늦게까지 먹거리가 많아요."},
 {h:"부산역·남포",t:"KTX 이용 시 편리. 자갈치·BIFF광장·영도·감천 원도심 코스에 가까워요."},
 {h:"기장 오시리아",t:"리조트·대형 호텔 위주. 테마파크·기장 해안 드라이브와 묶을 때 좋아요(차 있으면 편함)."}
];
const TRANS=[
 {h:"부산 도시철도",t:"1~4호선 + 부산김해경전철. 서면(1·2호선 환승)이 중심. 해운대·광안리는 2호선.",u:"https://www.humetro.busan.kr/",l:"부산교통공사"},
 {h:"동해선 (광역전철)",t:"부전역에서 센텀·벡스코·해운대(신해운대)·송정·기장·일광 거쳐 울산 태화강까지. 기장·송정 갈 때 유용해요.",q:"동해선 노선도"},
 {h:"김해공항 리무진",t:"해운대·기장 방면 노선과 서면·부전 방면 노선으로 운영. 서면 노선은 부산역을 경유하지 않아요.",u:"https://www.busan.go.kr/depart/khairportlm",l:"부산시 안내"},
 {h:"동백패스 (교통비 환급)",t:"동백전 교통카드로 대중교통 이용 시 월 기준금액 초과분을 환급해 주는 부산시 제도. 매주 부산 오가면 조건 확인해 볼 만해요(조건·대상은 공식 페이지 확인).",u:"https://www.busan.go.kr/depart/dongbaegpass001",l:"부산시 동백패스"},
 {h:"주차 팁",t:"해운대·광안리·기장 해안은 주말·축제일 주차가 매우 혼잡해요. 외곽 역 근처에 세우고 지하철·동해선 환승을 추천. 큰 행사 날엔 교통통제도 확인하세요.",q:"해운대 공영주차장"}
];

let tab=(["food","course","event","stay"].includes(location.hash.slice(1))?location.hash.slice(1):"food"),area="전체",favOnly=false,query="";
let favs=JSON.parse(localStorage.getItem("busan_favs")||"[]");
const saveFav=()=>localStorage.setItem("busan_favs",JSON.stringify(favs));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const heart=id=>`<button class="heart ${favs.includes(id)?"on":""}" data-fav="${esc(id)}" aria-label="찜">${favs.includes(id)?"♥":"♡"}</button>`;
const mapLinks=n=>`<a class="naver" href="${nmap(n)}" target="_blank" rel="noopener">네이버지도</a><a class="kakao" href="${kmap(n)}" target="_blank" rel="noopener">카카오맵</a>`;
const match=(...f)=>!query||f.join(" ").toLowerCase().includes(query);

function renderChips(){
 const show=tab==="food"||tab==="course";
 const el=document.getElementById("chips");
 el.classList.toggle("hide",!show);
 el.innerHTML=AREAS.map(a=>`<button class="chip ${a===area?"on":""}" data-area="${a}">${a}</button>`).join("");
}
function food(){
 const list=FOOD.filter(p=>(area==="전체"||p.a===area)&&(!favOnly||favs.includes("f:"+p.n))&&match(p.n,p.a,p.c,p.t));
 return `<div class="sec-title">맛집·카페 <span style="color:var(--sub);font-weight:400;font-size:13px">${list.length}곳</span></div>`+
 (list.length?list.map(p=>`<div class="card">${heart("f:"+p.n)}<h3>${esc(p.n)}</h3><div class="meta"><span class="tag">${p.a}</span><span class="tag cat">${p.c}</span></div><p class="note">${esc(p.t)}</p><div class="links">${mapLinks(p.q||p.n)}</div></div>`).join(""):`<div class="empty">${favOnly?"찜한 곳이 없어요. ♡를 눌러 저장해 보세요.":"검색 결과가 없어요."}</div>`);
}
function course(){
 const list=COURSES.filter(c=>(area==="전체"||c.a===area)&&(!favOnly||favs.includes("c:"+c.title))&&match(c.title,c.a,c.stops.flat().join(" ")));
 return `<div class="sec-title">하루 코스</div><p class="hint">순서대로 이동하는 동선이에요. 각 장소는 지도에서 바로 열 수 있어요.</p>`+
 (list.length?list.map(c=>`<div class="card">${heart("c:"+c.title)}<h3>${esc(c.title)}</h3><div class="meta"><span class="tag">${c.a}</span><span class="tag cat">${c.tag}</span></div><ol class="stops">${c.stops.map(s=>`<li><b>${esc(s[0])}</b>${esc(s[1])} · <a href="${nmap(s[0])}" target="_blank" rel="noopener">지도</a></li>`).join("")}</ol></div>`).join(""):`<div class="empty">해당 코스가 없어요.</div>`);
}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function event(){
 const today=new Date(),dow=today.getDay();
 const mon=new Date(today);mon.setDate(today.getDate()-((dow+6)%7));
 const sun=new Date(mon);sun.setDate(mon.getDate()+6);
 const t=fmt(today),ws=fmt(mon),we=fmt(sun);
 const list=EVENTS.filter(e=>(!favOnly||favs.includes("e:"+e.n))&&match(e.n,e.p,e.d)&&e.e>=t);
 const thisWeek=list.filter(e=>e.s<=we&&e.e>=ws);
 const later=list.filter(e=>!(e.s<=we&&e.e>=ws));
 const card=e=>`<div class="card">${heart("e:"+e.n)}<div class="date">${e.d}</div><h3>${esc(e.n)}</h3><div class="meta">${e.ok?'<span class="tag ok">날짜 확인됨</span>':'<span class="tag warn">일정 확인 필요</span>'}<span class="tag cat">출처: ${esc(e.src)}</span></div>${e.p?`<p class="note">📍 ${esc(e.p)}${e.x?"<br>ℹ️ "+esc(e.x):""}</p>`:(e.x?`<p class="note">ℹ️ ${esc(e.x)}</p>`:"")}<div class="links"><a class="off" href="${e.u}" target="_blank" rel="noopener">공식/출처 보기</a>${e.p?mapLinks(e.p.split(" (")[0].split("·")[0]):""}</div></div>`;
 return `<div class="banner"><b>이번 주 (${ws.slice(5).replace("-",".")} ~ ${we.slice(5).replace("-",".")})</b><p>날짜는 공식 홈페이지·Visit Busan 등에서 확인한 것만 넣었어요. 세부 프로그램은 바뀔 수 있어요.</p></div>`+
 `<div class="sec-title">이번 주 진행</div>`+(thisWeek.length?thisWeek.map(card).join(""):`<div class="empty">이번 주 등록된 행사가 없어요.</div>`)+
 `<div class="sec-title">다가오는 행사</div>`+(later.length?later.map(card).join(""):`<div class="empty">예정된 행사가 없어요.</div>`);
}
function stay(){
 const s=STAY.filter(x=>match(x.h,x.t)).map(x=>`<div class="card"><h3>🏨 ${x.h}</h3><p class="note">${esc(x.t)}</p><div class="links">${mapLinks(x.h+" 호텔")}</div></div>`).join("");
 const tr=TRANS.filter(x=>match(x.h,x.t)).map(x=>`<div class="card"><h3>🚇 ${x.h}</h3><p class="note">${esc(x.t)}</p><div class="links">${x.u?`<a class="off" href="${x.u}" target="_blank" rel="noopener">${x.l}</a>`:mapLinks(x.q)}</div></div>`).join("");
 return `<div class="sec-title">교통 팁</div>${tr||'<div class="empty">결과 없음</div>'}<div class="sec-title">숙소 지역 추천</div><p class="hint">당일치기가 기본이지만, 축제·늦은 밤 일정엔 이 지역들이 편해요.</p>${s||'<div class="empty">결과 없음</div>'}`;
}
function render(){
 renderChips();
 document.getElementById("main").innerHTML={food,course,event,stay}[tab]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 const fb=document.getElementById("favOnly");fb.classList.toggle("on",favOnly);fb.setAttribute("aria-pressed",favOnly);
 document.documentElement.style.setProperty("--hh",document.getElementById("hdr").offsetHeight+"px");
}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-area],[data-fav],#favOnly");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;window.scrollTo(0,0)}
 else if(t.dataset.area){area=t.dataset.area}
 else if(t.dataset.fav){const id=t.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFav()}
 else if(t.id==="favOnly"){favOnly=!favOnly}
 render();
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
render();
</script>
</body>
</html>
