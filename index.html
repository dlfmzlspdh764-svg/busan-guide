<style>
:root{--blue:#0b6bcb;--sea:#11a3c7;--bg:#f4f7fb;--card:#fff;--ink:#1c2430;--sub:#6b7686;--line:#e4e9f0;--pink:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe6ee;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--blue),var(--sea));color:#fff;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:2px 0 10px;font-size:12px;opacity:.9}
.search{display:flex;gap:6px}
.search input{flex:1;border:0;border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
.favbtn{border:0;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.2);color:#fff;font-size:13px;font-weight:600}
.favbtn.on{background:#fff;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);position:sticky;top:var(--hh,118px);z-index:9;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;border-radius:999px;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:4px 16px 16px}
.sec-title{font-size:16px;font-weight:700;margin:14px 0 8px}
.hint{font-size:12px;color:var(--sub);margin:0 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,40,80,.06);position:relative}
.card h3{margin:0 34px 4px 0;font-size:16px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:#eef4fb;color:var(--blue);font-weight:600}
.tag.cat{background:#fff4e6;color:#c76a00}
.tag.ok{background:#e7f8ee;color:#16884a}
.tag.warn{background:#fff1f1;color:#c62828}
.note{font-size:13px;color:#3a4553;line-height:1.5;margin:0 0 10px}
.links{display:flex;gap:6px;flex-wrap:wrap}

.naver{background:#03c75a;color:#fff}.kakao{background:#fee500;color:#191919}.off{background:#eef1f5;color:var(--ink)}

.heart.on{color:var(--pink)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 0}
ol.stops{margin:6px 0 10px;padding:0;list-style:none;counter-reset:s}

ol.stops li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--sea);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.stops li:not(:last-child)::after{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:var(--line)}
ol.stops b{display:block;font-size:14px}
ol.stops a{font-size:11px;color:var(--blue);text-decoration:none}
.date{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:4px}

function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function event(){

 const mon=new Date(today);mon.setDate(today.getDate()-((dow+6)%7));

 return `<div class="banner"><b>이번 주 (${ws.slice(5).replace("-",".")} ~ ${we.slice(5).replace("-",".")})</b><p>날짜는 공식 홈페이지·Visit Busan 등에서 확인한 것만 넣었어요. 세부 프로그램은 바뀔 수 있어요.</p></div>`+
 `<div class="sec-title">이번 주 진행</div>`+(thisWeek.length?thisWeek.map(card).join(""):`<div class="empty">이번 주 등록된 행사가 없어요.</div>`)+
 `<div class="sec-title">다가오는 행사</div>`+(later.length?later.map(card).join(""):`<div class="empty">예정된 행사가 없어요.</div>`);
}

 const s=STAY.filter(x=>match(x.h,x.t)).map(x=>`<div class="card"><h3>🏨 ${x.h}</h3><p class="note">${esc(x.t)}</p><div class="links">${mapLinks(x.h+" 호텔")}</div></div>`).join("");
 const tr=TRANS.filter(x=>match(x.h,x.t)).map(x=>`<div class="card"><h3>🚇 ${x.h}</h3><p class="note">${esc(x.t)}</p><div class="links">${x.u?`<a class="off" href="${x.u}" target="_blank" rel="noopener">${x.l}</a>`:mapLinks(x.q)}</div></div>`).join("");
 return `<div class="sec-title">교통 팁</div>${tr||'<div class="empty">결과 없음</div>'}<div class="sec-title">숙소 지역 추천</div><p class="hint">당일치기가 기본이지만, 축제·늦은 밤 일정엔 이 지역들이 편해요.</p>${s||'<div class="empty">결과 없음</div>'}`;
}
function render(){
 renderChips();
 document.getElementById("main").innerHTML={food,course,event,stay}[tab]();
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 const fb=document.getElementById("favOnly");fb.classList.toggle("on",favOnly);fb.setAttribute("aria-pressed",favOnly);
 document.documentElement.style.setProperty("--hh",document.getElementById("hdr").offsetHeight+"px");
}
document.addEventListener("click",e=>{
 if(e.target.closest("[data-close]")){closeSheet();return}
 const t=e.target.closest("[data-tab],[data-area],[data-cat],[data-fav],#favOnly,[data-open]");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;window.scrollTo(0,0)}
 else if(t.dataset.area){area=t.dataset.area;cat="전체"}
 else if(t.dataset.cat){cat=t.dataset.cat}
 else if(t.dataset.fav){const id=t.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFav();document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{const on=favs.includes(id);b.classList.toggle("on",on);b.textContent=on?"♥":"♡"});if(document.getElementById("sheet").classList.contains("open"))return}
 else if(t.dataset.open){openSheet(t.dataset.open);return}
 else if(t.id==="favOnly"){favOnly=!favOnly}
 render();
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
render();
const _m=location.hash.match(/^#place-(\d+)/);if(_m)openSheet(_m[1]);
</script>
</body>
