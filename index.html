 else if(t.dataset.cat){cat=t.dataset.cat}
 else if(t.dataset.ccat){ccat=t.dataset.ccat}
 else if(t.dataset.spot){openSpot(t.dataset.spot);return}
 else if(t.dataset.egu){egu=t.dataset.egu}
 else if(t.dataset.etype){etype=t.dataset.etype}
 else if(t.dataset.eper){eper=t.dataset.eper}
 else if(t.dataset.ev){openEvent(t.dataset.ev);return}
 else if(t.dataset.fav){const id=t.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFav();document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{const on=favs.includes(id);b.classList.toggle("on",on);b.textContent=on?"♥":"♡"});if(document.getElementById("sheet").classList.contains("open"))return}
 else if(t.dataset.open){openSheet(t.dataset.open);return}
 else if(t.id==="favOnly"){favOnly=!favOnly}
 render();
});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
render();
const _m=location.hash.match(/^#place-(\d+)/);if(_m)openSheet(_m[1]);
const _e=location.hash.match(/^#event-(.+)$/);if(_e){tab="event";render();openEvent(decodeURIComponent(_e[1]));}
loadEvents();
const _s=location.hash.match(/^#spot-(\d+)/);if(_s){tab="course";ccat="BEST 10";const _p=SPOTS.find(x=>x.id===_s[1]);if(_p)cgu=_p.gu;render();openSpot(_s[1]);}
const _g=location.hash.match(/^#course-(.+)$/);if(_g){tab="course";cgu=decodeURIComponent(_g[1]);render();}
</script>
