name: news

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update news.json
        env:
          TZ: Asia/Seoul
        run: python3 -u scripts/update_news.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('news.json'));assert len(d.get('items') or [])>=3, len(d.get('items') or []);print('news',len(d['items']))"
      - name: Commit if changed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json 변경 없음"
            exit 0
          fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add news.json
          git commit -m "뉴스 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push origin main
