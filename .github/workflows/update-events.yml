name: update-events

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update events.json
        env:
          TZ: Asia/Seoul
        run: python3 -u scripts/update_events.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('events.json'));assert len(d['events'])>20, len(d['events']);print('events',len(d['events']))"
      - name: Commit if changed
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json 변경 없음"
            exit 0
          fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add events.json
          git commit -m "행사 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push origin main
