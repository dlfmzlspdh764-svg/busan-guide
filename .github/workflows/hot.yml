name: hot

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours at :07 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update hot.json
        env:
          TZ: Asia/Seoul
        run: python3 -u scripts/update_hot.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('hot.json'));assert len(d.get('places') or [])>=3, d;print('hot',len(d['places']),'kw',len(d.get('keywords') or []),d.get('updated'))"
      - name: Commit if changed
        run: |
          if git diff --quiet -- hot.json; then
            echo "hot.json 변경 없음"
            exit 0
          fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add hot.json
          git commit -m "핫플 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
