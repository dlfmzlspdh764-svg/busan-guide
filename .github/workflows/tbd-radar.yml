name: tbd-radar

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 — 날짜 미정 전체 재확인
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-json
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve TBD dates
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -u scripts/tbd_radar.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('events.json'));assert len(d['events'])>20;print('events',len(d['events']),'tbd',sum(1 for e in d['events'] if len(e.get('s') or '')==7))"
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain events.json data/notified.json)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add events.json data/notified.json
          git commit -q -m "날짜 미정 레이더 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin main && git push -q origin main && break; sleep 5; done
