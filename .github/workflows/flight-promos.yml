name: flight-promos

on:
  schedule:
    - cron: "17 * * * *"   # 매시간 :17 UTC (가벼운 잡)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-promos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect airline promos + Telegram
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -u scripts/update_flight_promos.py
      - name: Commit if changed
        run: |
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add flight_promos.json data/flight_promos_seen.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "항공사 특가 이벤트 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep $((i*5))
          done
          exit 1
