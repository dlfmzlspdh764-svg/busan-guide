name: breaking-news

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (GitHub 사정으로 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breaking-news
  cancel-in-progress: false

jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check & send breaking alerts
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -u scripts/breaking.py
      - name: Commit state
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/breaking_sent.json data/notified.json)" ]; then
            echo "상태 변경 없음"; exit 0
          fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add data/breaking_sent.json data/notified.json
          git commit -q -m "속보 알림 상태 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
