name: food-weekly

on:
  schedule:
    - cron: "23 20 * * 0"
    - cron: "53 2 * * 1"   # 백업: 월 11:53 KST (같은 날 이미 돌면 결과 동일)   # 매주 월요일 05:23 KST (일요일 20:23 UTC)
  workflow_dispatch:
    inputs:
      photos_only:
        description: "사진만 갱신 (FOOD_PHOTOS_ONLY)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: food-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update food.json
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOD_PHOTOS_ONLY: ${{ github.event.inputs.photos_only == 'true' && '1' || '' }}
        run: |
          python3 -u scripts/update_food.py
          python3 -u scripts/update_family.py
      - name: Validate
        run: python3 -c "import json;d=json.load(open('food.json'));assert len(d['food'])>300 and len(d['sushi'])>=8;c=d.get('chinese') or [];assert len(c)>=8;f=d.get('family') or [];assert len(f)>=5;print('food',len(d['food']),'sushi',len(d['sushi']),'chinese',len(c),'family',len(f),'ims≥2',sum(1 for p in d['food']+d['sushi']+c if len(p.get('ims') or [])>=2),d['updated'])"
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain food.json index.html)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "busan-guide-bot"
          git config user.email "dlfmzlspdh764-svg@users.noreply.github.com"
          git add food.json index.html
          git commit -q -m "맛집 주간 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d') KST"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
